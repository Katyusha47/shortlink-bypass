{% extends "base.html" %}

{% block content %}
<section class="hero-section">
  <h1 class="hero-title">
    Resolve Shortlinks <span class="hero-highlight">Instantly & Safely</span>
  </h1>
  <p class="hero-subtitle">
    Unmask shortened URLs, ad-redirect gates, and download landing pages into direct original destinations without tracking or bloat.
  </p>
</section>

<!-- Resolver Card -->
<section class="resolver-container" aria-label="URL Resolution Tool">
  <div class="resolver-card">
    <form id="resolve-form" class="resolver-form" novalidate>
      <div class="input-wrapper">
        <label for="url-input" class="sr-only">Shortened URL</label>
        <input
          type="url"
          id="url-input"
          class="url-input"
          placeholder="Paste shortened link here (e.g., bit.ly/example, tinyurl.com/abc, mediafire.com/file/...)"
          required
          autofocus
          autocomplete="off"
          spellcheck="false"
        >
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn" class="btn btn-primary">
          Resolve Link
        </button>
      </div>
    </form>

    <!-- Dynamic Result Box -->
    <div id="result-container" aria-live="polite"></div>
  </div>
</section>
{% endblock %}
