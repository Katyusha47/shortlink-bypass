{% extends "base.html" %}

{% block content %}
<div style="text-align: center; max-width: 580px; margin: 4rem auto 6rem;">
  <span style="font-size: 5rem; font-weight: 800; color: var(--danger); display: block; line-height: 1;">500</span>
  <h1 style="font-size: 1.75rem; font-weight: 700; color: var(--text-primary); margin: 1rem 0 0.5rem;">Internal Server Error</h1>
  <p style="color: var(--text-secondary); margin-bottom: 2rem;">
    An unexpected error occurred while processing your request. Please try again later.
  </p>
  <a href="/" class="btn btn-primary" style="display: inline-flex;">Return to Link Resolver</a>
</div>
{% endblock %}
